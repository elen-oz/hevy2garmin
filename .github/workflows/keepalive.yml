name: Keepalive

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    name: Keep workflows active
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable workflows via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
