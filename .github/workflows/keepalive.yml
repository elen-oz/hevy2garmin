name: Keepalive

on:
  schedule:
    - cron: "0 3 * * 1"   
  workflow_dispatch:      

permissions:
  actions: write

jobs:
  keepalive:
    name: Keep workflows active
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "sync.yml"
          time_elapsed: "0"
